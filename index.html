<style>

ottom:1px solid #e1e4e8}.optionrow{border:1px solid #ddd;border-radius:10px;padding:12px;margin:9px 0}.optlabel{font-weight:800;margin-bottom:8px}.checks{display:flex;gap:10px 16px;flex-wrap:wrap}.checks label{font-size:14px}.photoGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.photo{border:1px solid #ddd;border-radius:10px;overflow:hidden;background:#fafafa}.photo img{width:100%;aspect-ratio:4/3;object-fit:cover}.photo input{border:0;border-top:1px solid #ddd;border-radius:0;width:100%;padding:8px}.notice{padding:12px;border-radius:9px;background:#fff7e8;border:1px solid #ecd6a7;font-size:14px}.good{background:#eef8f2;border-color:#b9dfc8}.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;padding:18px;z-index:50}.modal.hidden,.hidden{display:none!important}.dialog{background:#fff;width:min(650px,100%);max-height:90vh;overflow:auto;border-radius:14px;padding:22px}.dialog h2{margin-bottom:8px}.footer{text-align:center;color:#777;font-size:12px;padding:26px}.roleDemo{background:#fff8e8;border:1px solid #e8d6ae;border-radius:9px;padding:8px 10px}.paper{background:white;color:#111;padding:22px;max-width:8.5in;margin:auto}.paperHead{display:flex;align-items:center;border-bottom:3px solid var(--red);padding-bottom:8px;margin-bottom:10px}.paperHead img{width:145px}.paperTitle{margin-left:auto;text-align:right}.paperBox{border:1px solid #555;border-radius:5px;padding:9px;margin:8px 0}.paperFields{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:12px}.line{border-bottom:1px solid #777;min-height:19px}.qr{width:82px;height:82px}.printOnly{display:none}@media(max-width:760px){.wrap{padding:12px}.section{padding:14px;margin-top:14px;border-radius:12px}.section>h2{margin:-14px -14px 14px;padding:12px 14px 11px 18px;border-radius:12px 12px 0 0}.formgrid,.conditiongrid{grid-template-columns:1fr}.conditionwide,.conditionfull{grid-column:1}.specInput{flex:1 1 145px}.span8,.span4{grid-column:span 12}. /* V0.11 dashboard + form builder */

<div class="section formSection firstFormSection"><h2>Appraisal Information</h2><div class="formgrid">${field('date','Date',d.date||new Date().toISOString().slice(0,10),locked,false,'date')}${field('stock','Stock Number',r.stock,locked)}${field('desc','Desc. Code',d.desc||'',locked)}${field('location','Location',r.store,locked)}${field('salesinitials','Sales Initials',d.salesinitials||r.salesInitials||'',locked)}${field('asking','Asking Price $',d.asking||'',locked)}${field('make','Make',r.make,locked)}${field('model','Model',r.model,locked)}${field('year','Year',d.year||'',locked)}${field('serial','Full Serial Number',r.serial,locked,true,'text','full')}<div class="field"><label>Purchased</label><div class="choicegroup"><label class="choice"><input type="radio" name="purchased" value="New" ${d.purchased==='New'?'checked':''} ${locked?'disabled':''}> New</label><label class="choice"><input type="radio" name="purchased" value="Used" ${d.purchased==='Used'?'checked':''} ${locked?'disabled':''}> Used</label></div></div>${field('trade','Trade Range %',d.trade||'',locked)}<div class="field"><label>Unit Currently Located At</label><div class="choicegroup"><label class="choice"><input type="radio" name="unitloc" value="Customer" ${(d.unitloc||'Customer')==='Customer'?'checked':''} ${locked?'disabled':''}> Customer</label><label class="choice"><input type="radio" name="unitloc" value="Store" ${d.unitloc==='Store'?'checked':''} ${locked?'disabled':''}> Store</label></div></div></div></div>
<div class="section"><h2>Condition & Reconditioning</h2><div class="conditiongrid">${field('owner','Owner\'s Full Name',d.owner||r.customer||'',locked,false,'text','conditionwide')}${field('phone','Previous Owner Phone',d.phone||'',locked)}<div class="field conditionfull"><label>OK to contact previous owner</label><div class="choicegroup"><label class="choice"><input type="radio" name="contact" value="Yes" ${d.contact==='Yes'?'checked':''} ${locked?'disabled':''}> Yes</label><label class="choice"><input type="radio" name="contact" value="No" ${d.contact==='No'?'checked':''} ${locked?'disabled':''}> No</label></div></div>${field('general','General Appearance',d.general||'',locked)}${field('paint','Paint Appearance',d.paint||'',locked)}${field('mechanical','Mechanical Condition',d.mechanical||'',locked)}${field('hours','Engine / Unit Hours',d.hours||'',locked)}${field('hoursdate','Date Hours Were Taken',d.hoursdate||'',locked,false,'date')}${field('recon','Reconditioning Allowance $',d.recon||'',locked)}<div class="field conditionfull"><label>Reconditioning Plan</label><textarea id="reconplan" rows="3" ${locked?'disabled':''}>${esc(d.reconplan||'')}</textarea></div></div></div>
<div class="section"><h2>Equipment-Specific Options</h2>${renderRows(FORMS[r.form].rows,r.data,locked)}</div><div class="section"><h2>Descriptions & Notes</h2><textarea id="notes" rows="5" ${locked?'disabled':''} placeholder="Appraisal notes…">${esc(r.data?.notes||'')}</textarea></div></section><section class="panel span4"><h2>Photos</h2><p class="muted">Up to 20 equipment photos. Take a photo or choose existing photos.</p><input id="photoInput" type="file" accept="image/*" multiple ${locked?'disabled':''} onchange="loadPhotos(this.files,'equipment')"><div class="tiny muted" id="photoCount">0 / 20 selected</div><h3>Original Paper Appraisal</h3><p class="tiny muted">Internal supporting documents only. These do not appear in the customer-facing PDF.</p><input type="file" accept="image/*,application/pdf" multiple ${locked?'disabled':''} onchange="loadPhotos(this.files,'paper')"><div id="paperCount" class="tiny muted">0 supporting files selected</div><div class="section"><h2>Actions</h2><div class="actions">${!locked?'<button class="btn light" onclick="saveCurrent()">Save Draft</button>':''}${!locked&&r.status!=='Finalized'?'<button class="btn red" onclick="submitCurrent()">Submit</button>':''}${!locked&&r.status==='Submitted'&&currentUser.role==='Salesperson'?'<button class="btn dark" onclick="confirmFinalize()">Finalize</button>':''}${r.status==='Draft'&&r.salesEmail===currentUser.email?`<button class="btn out" onclick="deleteDraft('${r.id}');home()">Delete Draft</button>`:''}${r.status==='Blank Printed'&&r.salesEmail===currentUser.email?`<button class="btn out" onclick="markUnused('${r.id}');home()">Mark Unused</button>`:''}<button class="btn out" onclick="printCompleted()">Save / Share PDF</button>${r.status==='Blank Printed'?'<button class="btn out" onclick="printBlank()">Blank Printable</button>':''}</div></div><div class="section"><h3>History</h3><div class="tiny">${(r.audit||[]).slice().reverse().map(a=>`<div style="margin:7px 0"><b>${esc(a.action.replaceAll('_',' '))}</b><br><span class="muted">${new Date(a.at).toLocaleString()} · ${esc(a.by)}</span></div>`).join('')||'No history yet.'}</div></div></section><section class="panel span12"><h2>Equipment Photo Preview</h2><div id="photoGrid" class="photoGrid"><span class="muted">No photos selected in this session.</span></div></section></div>`;refreshAttachmentUI()}
function field(id,label,val,locked,req=false,type='text',extra=''){return `<div class="field ${extra}"><label>${label}${req?' <span class="req">*</span>':''}</label><input id="${id}" type="${type}" value="${esc(val)}" ${locked?'disabled':''}></div>`}
function renderRows(rows,data,locked){return rows.map((r,ri)=>{const defs=inputDefinitions(r),opts=checkboxOptions(r),saved=data||{};let inputs=defs.length?`<div class="specInputs">${defs.map((d,di)=>`<label class="specInput"><b>${esc(d.label)}</b><input type="${d.type}" ${d.min!=null?`min="${d.min}"`:''} ${d.max!=null?`max="${d.max}"`:''} data-textkey="r${ri}_in_${d.key||di}" value="${esc(saved['r'+ri+'_in_'+(d.key||di)]||'')}" ${locked?'disabled':''}></label>`).join('')}</div>`:'';let checks=opts.length?`<div class="checks">${opts.map(o=>`<label><input type="checkbox" data-key="r${ri}" value="${esc(o)}" ${(saved['r'+ri]||[]).includes(o)?'checked':''} ${locked?'disabled':''}> ${esc(o)}</label>`).join('')}</div>`:'';let other=(!defs.length&&!opts.length)?`<input class="specOther" data-textkey="r${ri}" value="${esc(saved['r'+ri]||'')}" ${locked?'disabled':''}>`:'';return `<div class="optionrow"><div class="optlabel">${esc(r.label||'Options')}</div>${inputs}${checks}${other}</div>`}).join('')}
function radioVal(name){return document.querySelector(`input[name="${name}"]:checked`)?.value||''}
function collect(){let data={notes:$('#notes')?.value||'',date:$('#date')?.value||'',desc:$('#desc')?.value||'',salesinitials:$('#salesinitials')?.value||'',asking:$('#asking')?.value||'',year:$('#year')?.value||'',purchased:radioVal('purchased'),unitloc:radioVal('unitloc'),trade:$('#trade')?.value||'',owner:$('#owner')?.value||'',phone:$('#phone')?.value||'',contact:radioVal('contact'),general:$('#general')?.value||'',paint:$('#paint')?.value||'',mechanical:$('#mechanical')?.value||'',hours:$('#hours')?.value||'',hoursdate:$('#hoursdate')?.value||'',recon:$('#recon')?.value||'',reconplan:$('#reconplan')?.value||''};document.querySelectorAll('[data-key]').forEach(x=>{if(x.checked)(data[x.dataset.key]??=[]).push(x.value)});document.querySelectorAll('[data-textkey]').forEach(x=>data[x.dataset.textkey]=x.value);return {serial:$('#serial')?.value.trim()||'',make:$('#make')?.value.trim()||'',model:$('#model')?.value.trim()||'',stock:$('#stock')?.value.trim()||'',customer:$('#owner')?.value.trim()||'',data}}
function persist(status,action){let d=db(),r=d.records.find(x=>x.id===current.id),v=collect();Object.assign(r,v,{status,updated:new Date().toISOString()});r.audit??=[];r.audit.push({at:r.updated,by:currentUser.email,action});put(d);current=r;return r}
function saveCurrent(){persist('Draft','DRAFT_SAVED');openRecord(current.id)}
function submitCurrent(){let v=collect();if(!v.serial){alert('Full Serial Number is required before submitting.');$('#serial').focus();return}let d=db(),dupes=d.records.filter(x=>x.id!==current.id&&x.serial&&x.serial.toLowerCase()===v.serial.toLowerCase());if(dupes.length&&!confirm(`Serial ${v.serial} also appears on ${dupes.map(x=>x.id).join(', ')}. Continue anyway?`))return;let r=d.records.find(x=>x.id===current.id);Object.assign(r,v,{status:'Submitted',updated:new Date().toISOString(),revisions:(r.revisions||0)+1});r.audit??=[];r.audit.push({at:r.updated,by:currentUser.email,action:'REVISION_'+r.revisions+'_SUBMITTED'});put(d);current=r;openRecord(r.id)}
function confirmFinalize(){if(!$('#customer').value.trim()){alert('Customer Name is required before Finalizing.');return}showModal(`<h2>Finalize ${current.id}?</h2><p>Once finalized, you will no longer be able to edit this appraisal. A System Administrator must reopen it if corrections are required.</p><div class="actions"><button class="btn light" onclick="hideModal()">Cancel</button><button class="btn red" onclick="doFinalize()">Finalize Appraisal</button></div>`)}
function doFinalize(){let d=db(),r=d.records.find(x=>x.id===current.id);r.status='Finalized';r.updated=new Date().toISOString();r.audit.push({at:r.updated,by:currentUser.email,action:'FINALIZED'});put(d);hideModal();openRecord(r.id)}
function refreshAttachmentUI(){
 if(document.getElementById('photoCount')) photoCount.textContent=`${photos.length} / 20 selected`;
 if(document.getElementById('photoGrid')) photoGrid.innerHTML=photos.length?photos.map((p,i)=>`<div class="photo">${p.url?`<img src="${p.url}">`:'<div style="padding:30px">File</div>'}<input placeholder="Optional caption" value="${esc(p.caption||'')}" oninput="photos[${i}].caption=this.value;photoSessions[current.id]=photos"></div>`).join(''):'<span class="muted">No photos selected in this session.</span>';
 if(document.getElementById('paperCount')) paperCount.textContent=`${paperPhotos.length} supporting file${paperPhotos.length===1?'':'s'} selected`;
}
function loadPhotos(files,type){let arr=type==='equipment'?photos:paperPhotos,max=type==='equipment'?20:50;for(let f of [...files]){if(arr.length>=max)break;arr.push({file:f,url:f.type.startsWith('image/')?URL.createObjectURL(f):'',caption:''})}if(current){if(type==='equipment')photoSessions[current.id]=arr;else paperPhotoSessions[current.id]=arr}refreshAttachmentUI()}

function inputDefinitions(r){
  const label=(r.label||"").toLowerCase();
  const opts=r.options||[];
  const defs=[];

  // Generic front/rear tire or track SIZE rows were blank-entry fields on the paper forms.
  if(/^(front|rear) tire\/track size$/.test(label)){
    const side=label.startsWith("front")?"Front":"Rear";
    defs.push({label:side+" Tire/Track Size",type:"text",key:"size"});
    if(opts.some(o=>/duals/i.test(o))) defs.push({label:side+" Duals %",type:"number",key:"duals",min:0,max:100});
    if(opts.some(o=>/triples/i.test(o))) defs.push({label:side+" Triples %",type:"number",key:"triples",min:0,max:100});
    return defs;
  }

  // Tread / wear percentage rows should be entered as percentages, not checked.
  if(/tread\s*%|track\s*%/.test(label) || opts.some(o=>/tread\s*%/i.test(o))){
    // Avoid converting rows that are clearly lists of real tire/track sizes.
    const realSizeChoices=opts.filter(o=>/\d+[\/x.-]\d+|R\d+|tracks?$/i.test(o)).length;
    if(realSizeChoices < 2){
      const pctOpts=opts.filter(o=>/%|tread/i.test(o));
      if(pctOpts.length){
        pctOpts.forEach((o,k)=>{
          let clean=o.replace(/^%+\s*/,"").replace(/\s*%+$/,"").replace(/tread/ig,"").trim();
          if(!clean) clean=(label.includes("front")?"Front":label.includes("rear")?"Rear":"Wear");
          defs.push({label:clean+" %",type:"number",key:"pct"+k,min:0,max:100});
        });
      }else{
        defs.push({label:r.label,type:"number",key:"pct",min:0,max:100});
      }
      return defs;
    }
  }

  // Rows like Tire BrandOther contain Front Tread % / Rear Tread % entry fields.
  if(opts.length && opts.every(o=>/tread\s*%/i.test(o))){
    opts.forEach((o,k)=>defs.push({
      label:o.replace(/\s*%/,"").trim()+" %",
      type:"number",key:"pct"+k,min:0,max:100
    }));
    return defs;
  }

  // Transmission: keep transmission types selectable, but gears are entered numerically.
  if(label==="transmission" && opts.some(o=>/forward gears|reverse gears/i.test(o))){
    opts.forEach((o,k)=>{
      if(/forward gears/i.test(o)) defs.push({label:"Forward Gears",type:"number",key:"fwd",min:0});
      else if(/reverse gears/i.test(o)) defs.push({label:"Reverse Gears",type:"number",key:"rev",min:0});
      else if(/^ranges?$/i.test(o.trim())) defs.push({label:"Ranges",type:"number",key:"ranges",min:0});
    });
    return defs;
  }

  // Tire Appraisal: number of tires and tread % are both numeric entries.
  if(label==="number of tires"){
    defs.push({label:"Number of Tires",type:"number",key:"count",min:0});
    defs.push({label:"Tread %",type:"number",key:"tread",min:0,max:100});
    return defs;
  }

  // A standalone Track % row is a numeric wear field.
  if(label==="track %"){
    defs.push({label:"Track %",type:"number",key:"trackpct",min:0,max:100});
    return defs;
  }

  return defs;
}

function checkboxOptions(r){
  const label=(r.label||"").toLowerCase();
  let opts=[...(r.options||[])];

  // PTO rows: always provide a None choice when PTO selections are applicable.
  // Do not duplicate it if the source row already contains None / No PTO.
  if(/\bpto\b/.test(label) && opts.length && !opts.some(o=>/^(none|no pto)$/i.test(String(o).trim()))){
    opts.push("None");
  }
  if(/^(front|rear) tire\/track size$/.test(label)) return [];
  if(label==="number of tires" || label==="track %") return [];
  if(label==="transmission" && opts.some(o=>/forward gears|reverse gears/i.test(o))){
    return opts.filter(o=>!/forward gears|reverse gears/i.test(o) && !/^ranges?$/i.test(o.trim()));
  }
  if(opts.length && opts.every(o=>/tread\s*%/i.test(o))) return [];
  if(/tread\s*%/.test(label) && !opts.some(o=>/\d+[\/x.-]\d+|R\d+|tracks?$/i.test(o))) return [];
  return opts;
}

   function completedMetrics(it,fs,lead){doc.setFontSize(fs);doc.setFont('helvetica','bold');let ll=doc.splitTextToSize(it.label+':',colW);doc.setFont('helvetica','normal');let vl=doc.splitTextToSize((it.values||[]).join('   •   ')||'________________________',colW);return {ll,vl,need:(ll.length+vl.length)*lead+5}}
   function completedFits(fs,lead){let c=0,cy=y;for(const it of items){const q=completedMetrics(it,fs,lead);if(q.need>optionBottom-y)return false;if(cy+q.need>optionBottom){c++;cy=y}if(c>=cols)return false;cy+=q.need}return true}
   let fs=8.2,lead=10.0;for(const cand of [[8.2,10],[8.0,9.8],[7.8,9.5],[7.6,9.2],[7.4,9.0],[7.2,8.8],[7.0,8.5],[6.8,8.2],[6.6,8.0]]){if(completedFits(cand[0],cand[1])){fs=cand[0];lead=cand[1];break}}
   items.forEach(it=>{const q=completedMetrics(it,fs,lead);if(oy+q.need>optionBottom&&col<cols-1)nextCol();doc.setFontSize(fs);doc.setFont('helvetica','bold');doc.text(q.ll,ox,oy);oy+=q.ll.length*lead;doc.setFont('helvetica','normal');doc.text(q.vl,ox,oy);oy+=q.vl.length*lead+5});
 }
 doc.setLineWidth(.25);doc.line(m+7+colW+cgap/2,top+20,m+7+colW+cgap/2,top+optionHeight-7);doc.line(m+7+(colW+cgap)*2-cgap/2,top+20,m+7+(colW+cgap)*2-cgap/2,top+optionHeight-7);
 top=654;y=sectionBox('Descriptions / Notes',top,113);doc.setFont('helvetica','bold');doc.setFontSize(7.7);doc.text('Internal Description / Specs:',m+7,y);y+=7;doc.line(m+7,y,W-m-7,y);if(!blank&&live.data?.notes){doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.text(doc.splitTextToSize(live.data.notes,fullW-20).slice(0,2),m+9,y-2)}y+=14;doc.line(m+7,y,W-m-7,y);y+=16;doc.setFont('helvetica','bold');doc.text('Base and Options:',m+7,y);y+=7;doc.line(m+7,y,W-m-7,y);y+=14;doc.line(m+7,y,W-m-7,y);y+=16;doc.text('Memo:',m+7,y);y+=7;doc.line(m+7,y,W-m-7,y);y+=14;doc.line(m+7,y,W-m-7,y);
 doc.setFont('helvetica','normal');doc.setFontSize(7);doc.setDrawColor(200,16,46);doc.setLineWidth(1.2);doc.line(m,H-18,W-m,H-18);doc.setDrawColor(0);doc.text('Arnold Companies - Equipment Appraisal',m,H-9);doc.text(r.id+' · Form Version '+r.version+' · Prototype 0.11',W-m,H-9,{align:'right'});return doc
}
async function addPhotoPages(doc,r){if(!photos.length)return;for(let i=0;i<photos.length;i++){if(i%4===0){doc.addPage('letter','portrait');try{doc.addImage(APPRAISAL_LOGO,'JPEG',24,12,105,25)}catch(e){}doc.setDrawColor(200,16,46);doc.setLineWidth(2.2);doc.line(24,42,588,42);doc.setFont('helvetica','bold');doc.setFontSize(10);doc.text('Equipment Photos',588,24,{align:'right'});doc.setFontSize(8);doc.text(r.id,588,35,{align:'right'})}let slot=i%4,row=Math.floor(slot/2),col=slot%2,x=24+col*282,y=55+row*350,w=270,h=285;try{let data=await fileToDataURL(photos[i].file);doc.addImage(data,'JPEG',x,y,w,h,undefined,'FAST')}catch(e){}doc.setFont('helvetica','normal');doc.setFontSize(8);doc.text(photos[i].caption||('Photo '+(i+1)),x,y+h+13)} }
async function deliverPdf(doc,name){const blob=doc.output('blob');const isiOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);if(isiOS&&navigator.share){const file=new File([blob],name,{type:'application/pdf'});if(!navigator.canShare||navigator.canShare({files:[file]})){try{await navigator.share({title:name,files:[file]});return}catch(e){if(e&&e.name==='AbortError')return}}}const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.style.display='none';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000)}
async function printBlank(){let r=current;if(!r)return;let doc=makeAppraisalPdf(r,true);if(!doc)return;await deliverPdf(doc,pdfSafeNameV2(r,true))}
async function printCompleted(){let r=current;if(!r)return;let doc=makeAppraisalPdf(r,false);if(!doc)return;await addPhotoPages(doc,r);await deliverPdf(doc,pdfSafeNameV2(r,false))}


const FORM_BUILDER_KEY='arnolds_v2_form_builder_v1';
let builderIndex=0,builderDraft=null;
function loadBuilderOverrides(){try{let x=JSON.parse(localStorage.getItem(FORM_BUILDER_KEY)||'{}');Object.keys(x).forEach(k=>{let i=FORMS.findIndex(f=>f.title===k);if(i>=0&&x[k]?.published)FORMS[i]=x[k].published})}catch(e){}}
function builderStore(){try{return JSON.parse(localStorage.getItem(FORM_BUILDER_KEY)||'{}')}catch(e){return {}}}
function saveBuilderStore(x){localStorage.setItem(FORM_BUILDER_KEY,JSON.stringify(x))}
function formBuilder(i=0){if(currentUser.role!=='System Admin'){alert('Form Builder is limited to Form Admins.');return}builderIndex=Math.max(0,Math.min(i,FORMS.length-1));let st=builderStore(),f=FORMS[builderIndex],entry=st[f.title];builderDraft=JSON.parse(JSON.stringify(entry?.draft||f));renderBuilder()}
function renderBuilder(){let f=builderDraft,st=builderStore(),entry=st[FORMS[builderIndex].title]||{},dirty=JSON.stringify(f)!==JSON.stringify(FORMS[builderIndex]);app.innerHTML=`<div class="builderShell"><aside class="homecard"><div class="cardtitle">Appraisal Forms</div><input class="search" placeholder="Search forms…" oninput="filterBuilderList(this.value)"><div class="builderList" id="builderList">${FORMS.map((x,i)=>`<div class="builderItem ${i===builderIndex?'active':''}" data-name="${esc(x.title.toLowerCase())}" onclick="builderSelect(${i})"><b>${esc(x.title)}</b><div class="tiny muted">${esc(x.category)}</div></div>`).join('')}</div><button class="btn red" style="width:100%;margin-top:10px" onclick="newBuilderForm()">＋ New Appraisal Type</button><button class="btn light" style="width:100%;margin-top:8px" onclick="home()">← Dashboard</button></aside><section class="homecard"><div class="welcome"><div><div class="cardtitle">Form Builder</div><div class="muted">Edit → Preview → Publish Changes</div></div><span class="formStatus ${dirty?'':'publishedStatus'}">${dirty?'Draft Changes':'Published'}</span></div><div class="formgrid two" style="margin-top:16px"><div class="field"><label>Appraisal Name</label><input id="btitle" value="${esc(f.title)}" oninput="builderMeta()"></div><div class="field"><label>Category</label><input id="bcat" value="${esc(f.category)}" oninput="builderMeta()"></div></div><div class="builderToolbar"><button class="btn out" onclick="addBuilderRow()">＋ Add Option Group</button><button class="btn out" onclick="builderPreview()">Preview Website Form</button><button class="btn dark" onclick="saveBuilderDraft()">Save Draft Changes</button><button class="btn red" onclick="publishBuilder()">Publish Changes</button></div><div class="notice">Full Serial Number remains system-required for submitted appraisals and cannot be removed in Form Builder.</div><h3>Equipment-Specific Options</h3><div id="builderRows">${f.rows.map((r,ri)=>builderRowHtml(r,ri)).join('')}</div></section></div>`}
function filterBuilderList(q){q=q.toLowerCase();document.querySelectorAll('.builderItem').forEach(x=>x.style.display=x.dataset.name.includes(q)?'block':'none')}
function builderSelect(i){saveBuilderDraft(true);formBuilder(i)}
function builderMeta(){builderDraft.title=$('#btitle').value;builderDraft.category=$('#bcat').value}
function builderRowHtml(r,ri){return `<div class="builderRow"><div class="field"><label>Group / Field Label</label><input value="${esc(r.label)}" oninput="builderDraft.rows[${ri}].label=this.value"></div><div class="builderOpts" style="margin-top:9px">${r.options.map((o,oi)=>`<input value="${esc(o)}" oninput="builderDraft.rows[${ri}].options[${oi}]=this.value"><button class="btn light" onclick="removeBuilderOption(${ri},${oi})">×</button>`).join('')}</div><div class="actions" style="margin-top:9px"><button class="btn light" onclick="addBuilderOption(${ri})">＋ Choice / Input</button><button class="btn light" onclick="moveBuilderRow(${ri},-1)">↑</button><button class="btn light" onclick="moveBuilderRow(${ri},1)">↓</button><button class="btn out" onclick="removeBuilderRow(${ri})">Remove Group</button></div></div>`}
function addBuilderRow(){builderDraft.rows.push({label:'New Option Group',options:['Option 1']});renderBuilder()}
function removeBuilderRow(i){if(confirm('Remove this option group?')){builderDraft.rows.splice(i,1);renderBuilder()}}
function moveBuilderRow(i,d){let j=i+d;if(j<0||j>=builderDraft.rows.length)return;[builderDraft.rows[i],builderDraft.rows[j]]=[builderDraft.rows[j],builderDraft.rows[i]];renderBuilder()}
function addBuilderOption(i){builderDraft.rows[i].options.push('New Option');renderBuilder()}
function removeBuilderOption(i,j){builderDraft.rows[i].options.splice(j,1);renderBuilder()}
function saveBuilderDraft(silent=false){builderMeta();let st=builderStore(),key=FORMS[builderIndex].title;st[key]=st[key]||{};st[key].draft=JSON.parse(JSON.stringify(builderDraft));saveBuilderStore(st);if(!silent)alert('Draft form changes saved. Salespeople will not see them until you Publish Changes.')}
function publishBuilder(){builderMeta();if(!builderDraft.title.trim()){alert('Appraisal Name is required.');return}if(!confirm('Publish these form changes? New appraisals will use this version. Existing appraisals keep their original form version.'))return;let oldKey=FORMS[builderIndex].title,st=builderStore();let entry=st[oldKey]||{};entry.history=entry.history||[];entry.history.push({publishedAt:new Date().toISOString(),form:JSON.parse(JSON.stringify(FORMS[builderIndex]))});entry.published=JSON.parse(JSON.stringify(builderDraft));entry.draft=null;if(builderDraft.title!==oldKey){delete st[oldKey];st[builderDraft.title]=entry}else st[oldKey]=entry;FORMS[builderIndex]=JSON.parse(JSON.stringify(builderDraft));saveBuilderStore(st);alert('Published. New appraisals now use the updated form.');formBuilder(builderIndex)}
function builderPreview(){builderMeta();showModal(`<h2>Website Form Preview</h2><div class="muted">${esc(builderDraft.title)} · ${esc(builderDraft.category)}</div><div class="section"><h2>Equipment-Specific Options</h2>${builderDraft.rows.map(r=>`<div class="optionrow"><div class="optlabel">${esc(r.label)}</div><div class="checks">${r.options.map(o=>`<label><input type="checkbox" disabled> ${esc(o)}</label>`).join('')}</div></div>`).join('')}</div><div class="actions"><button class="btn dark" onclick="hideModal()">Close Preview</button></div>`)}
function newBuilderForm(){let name=prompt('New appraisal type name:');if(!name)return;FORMS.push({title:name,file:'Form Builder',category:'Other',rows:[]});builderIndex=FORMS.length-1;builderDraft=JSON.parse(JSON.stringify(FORMS[builderIndex]));renderBuilder()}

function showModal(x){dialog.innerHTML=x;modal.classList.remove('hidden')}function hideModal(){modal.classList.add('hidden')}
loadBuilderOverrides();userBar();home();
</script><div class="footer"><strong>Arnold's Appraisal System V2 · Prototype Version 0.11</strong></div></body></html>
