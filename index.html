function fillForms(){let c=$('#cat')?.value||'',a=FORMS.map((f,i)=>({f,i})).filter(x=>!c||x.f.category===c);$('#fsel').innerHTML=a.map(x=>`<option value="${x.i}">${esc(x.f.title)}</option>`).join('')}
function createRecord(mode){let fi=Number($('#fsel').value),id=nextId(),now=new Date().toISOString(),r={id,status:mode==='blank'?'Blank Printed':'Draft',form:fi,formName:FORMS[fi].title,version:1,salesEmail:currentUser.email,salesName:currentUser.name,initials:currentUser.initials,store:currentUser.locations[0],created:now,updated:now,serial:'',make:'',model:'',customer:'',stock:'',data:{salesinitials:currentUser.initials},revisions:0,audit:[{at:now,by:currentUser.email,action:mode==='blank'?'BLANK_PRINTED':'CREATED'}]};let d=db();d.records.push(r);put(d);hideModal();if(mode==='blank'){current=r;printBlank()}else openRecord(id)}
function enterPrinted(){showModal(`<h2>Enter Printed Appraisal</h2><p>Enter the number printed on the paper appraisal.</p><div class="field"><label>Appraisal #</label><input id="printedId" placeholder="26-00125" inputmode="text"></div><div id="printedMsg" class="muted" style="margin-top:8px"></div><div class="actions" style="margin-top:18px"><button class="btn light" onclick="hideModal()">Cancel</button><button class="btn red" onclick="findPrinted()">Find Appraisal</button></div>`)}
function findPrinted(){let id=$('#printedId').value.trim().toUpperCase(),r=db().records.find(x=>x.id===id);if(!r){$('#printedMsg').textContent='That appraisal number was not found.';return}if(r.status!=='Blank Printed'){ $('#printedMsg').textContent='That appraisal is currently '+r.status+'.';return}if(!canSee(r)){ $('#printedMsg').textContent='You do not have access to that store.';return}hideModal();openRecord(id)}
function openRecord(id){let r=db().records.find(x=>x.id===id);if(!r||!canSee(r))return;current=r;photos=photoSessions[id]||[];paperPhotos=paperPhotoSessions[id]||[];internalPhotos=internalPhotoSessions[id]||[];let locked=r.status==='Finalized'||currentUser.role==='Store Manager',d=r.data||{};app.innerHTML=`<div class="grid"><section class="panel span12"><div class="actions"><button class="btn light" onclick="home()">← Back</button><span class="badge ${r.status.replace(' ','')}">${r.status}</span><span style="font-weight:900;font-size:20px">${r.id}</span></div><h1 style="margin-top:14px">${esc(r.formName)}</h1><div class="muted">Form Version ${r.version} · ${esc(r.salesName)} · ${esc(r.store)}</div>${locked?'<div class="notice good" style="margin-top:12px">This appraisal is locked for editing.</div>':''}</section><section class="panel span8">

<div class="section"><h2>Condition & Reconditioning</h2><div class="conditiongrid">${field('owner','Owner\'s Full Name',d.owner||r.customer||'',locked,false,'text','conditionwide')}${field('phone','Previous Owner Phone',d.phone||'',locked)}<div class="field conditionfull"><label>OK to contact previous owner</label><div class="choicegroup"><label class="choice"><input type="radio" name="contact" value="Yes" ${d.contact==='Yes'?'checked':''} ${locked?'disabled':''}> Yes</label><label class="choice"><input type="radio" name="contact" value="No" ${d.contact==='No'?'checked':''} ${locked?'disabled':''}> No</label></div></div>${conditionPhotoField('general','General Appearance',d.general||'',locked,'condition_general')}${conditionPhotoField('paint','Paint Appearance',d.paint||'',locked,'condition_paint')}${field('mechanical','Mechanical Condition',d.mechanical||'',locked)}${field('hours','Engine Hours',d.hours||'',locked)}${field('hoursdate','Date Hours Were Taken',d.hoursdate||'',locked,false,'date')}${field('recon','Reconditioning Allowance $',d.recon||'',locked)}<div class="field conditionfull"><label>Reconditioning Plan</label><textarea id="reconplan" rows="3" ${locked?'disabled':''}>${esc(d.reconplan||'')}</textarea></div></div></div>
${renderConfiguredFormSections(FORMS[r.form],r.data,locked)}<div class="section"><h2>Descriptions & Notes</h2><div class="notesWithPhoto"><div class="notesMain"><textarea id="notes" rows="5" ${locked?'disabled':''} placeholder="Appraisal notes…">${esc(r.data?.notes||'')}</textarea></div><div class="notesPhotoBox"><input id="internalNotesPhoto" type="file" accept="image/*" multiple hidden ${locked?'disabled':''} onchange="loadInternalPhotos(this.files);this.value=''"> <button type="button" class="groupPhotoBtn internalPhotoBtn" ${locked?'disabled':''} onclick="document.getElementById('internalNotesPhoto').click()">📷 <span id="internalPhotoBtnText">Add Internal Photo</span></button><div class="tiny muted" style="margin-top:6px">Internal only · not included on clean PDF</div><div id="internalPhotoThumbs" class="groupPhotoThumbs"></div></div></div></div></section><section class="panel span4"><h2>Photos</h2><p class="muted">Up to 20 PDF equipment photos total. Group photos can include multiple pictures. Notes/Internal photos are stored separately and are not included on the clean PDF.</p><input id="photoInput" type="file" accept="image/*" multiple ${locked?'disabled':''} onchange="loadPhotos(this.files,'equipment')"><div class="tiny muted" id="photoCount">0 / 20 selected</div><h3>Original Paper Appraisal</h3><p class="tiny muted">Internal supporting documents only. These do not appear in the customer-facing PDF.</p><input type="file" accept="image/*,application/pdf" multiple ${locked?'disabled':''} onchange="loadPhotos(this.files,'paper')"><div id="paperCount" class="tiny muted">0 supporting files selected</div><div class="section"><h2>Actions</h2><div class="actions">${!locked?'<button class="btn light" onclick="saveCurrent()">Save Draft</button>':''}${!locked&&r.status!=='Finalized'?'<button class="btn red" onclick="submitCurrent()">Submit</button>':''}${!locked&&r.status==='Submitted'&&currentUser.role==='Salesperson'?'<button class="btn dark" onclick="confirmFinalize function field(id,label,val,locked,req=false,type='text',extra=''){return `<div class="field ${extra}"><label>${label}${req?' <span class="req">*</span>':''}</label><input id="${id}" type="${type}" value="${esc(val)}" ${locked?'disabled':''}></div>`}

function tireBrandControl(r,ri,data,locked){let key=`r${ri}_tirebrand`,otherKey=`r${ri}_tirebrand_other`,v=data?.[key]||'',ov=data?.[otherKey]||'';return `<div class="specInputs"><label class="specInput" style="flex:1"><b>Tire Brand</b><select data-textkey="${key}" onchange="document.getElementById('tireOther_${ri}').style.display=this.value==='Other'?'block':'none'" ${locked?'disabled':''}><option value="">Select tire brand…</option>${TIRE_BRANDS.map(b=>`<option value="${esc(b)}" ${v===b?'selected':''}>${esc(b)}</option>`).join('')}</select></label><input id="tireOther_${ri}" class="specOther" style="${v==='Other'?'':'display:none;'}flex:1" placeholder="Enter other tire brand" data-textkey="${otherKey}" value="${esc(ov)}" ${locked?'disabled':''}></div>`}
function renderConfiguredFormSections(form,data,locked){let rows=form?.rows||[],names=[];rows.forEach(r=>{let n=String(r.builderSection||'Equipment-Specific Options').trim()||'Equipment-Specific Options';if(!names.includes(n))names.push(n)});(form?.builderSections||[]).forEach(n=>{n=String(n||'').trim();if(n&&!names.includes(n))names.push(n)});if(!names.length)names=['Equipment-Specific Options'];return names.map(name=>{let subset=[],map=[];rows.forEach((r,i)=>{let n=String(r.builderSection||'Equipment-Specific Options').trim()||'Equipment-Specific Options';if(n===name){subset.push(r);map.push(i)}});if(!subset.length)return '';return `<div class="section"><h2>${esc(name)}</h2>${renderRowsIndexed(subset,map,data,locked)}</div>`}).join('')}

function groupPhotoControl(ri,label,locked){let gp=photos.filter(p=>p.groupKey===`r${ri}`),count=gp.length;return `<div class="groupPhotoBox"><div><input id="groupPhoto_${ri}" type="file" accept="image/*" multiple hidden ${locked?'disabled':''} onchange="loadGroupPhotos(this.files,${ri},'${esc(String(label||'Equipment Option')).replaceAll("'","&#39;")}');this.value=''"><button type="button" class="groupPhotoBtn" ${locked?'disabled':''} onclick="document.getElementById('groupPhoto_${ri}').click()">📷 ${count?count+' Photo'+(count===1?'':'s')+' · Add More':'Add Photo'}</button>${count?`<div class="groupPhotoThumbs">${gp.slice(0,3).map(p=>p.url?`<img src="${p.url}" title="${esc(p.groupLabel||'')}">`:'').join('')}</div><div class="groupPhotoCount">Attached to ${esc(label||'this group')}</div>`:''}</div></div>`}

function renderOneRow(r,ri,data,locked){const saved=data||{},t=r.fieldType||'auto',req=r.required?'required':'',mark=r.required?'<span class="req"> *</span>':'';if(isTireBrandField(r)){return `<div class="optionrow"><div class="optionrowInner"><div class="optionrowContent"><div class="optlabel">Tire Brand${mark}</div>${tireBrandControl(r,ri,saved,locked)}</div>${groupPhotoControl(ri,'Tire Brand',locked)}</div></div>`;}if(t!=='auto'){let key=`r${ri}_field`,v=saved[key]||'',ctl='';if(t==='text')ctl=`<input class="specOther" data-textkey="${key}" value="${esc(v)}" ${req} ${locked?'disabled':''}>`;else if(t==='number')ctl=`<input class="specOther" type="number" data-textkey="${key}" value="${esc(v)}" ${req} ${locked?'disabled':''}>`;else if(t==='percentage')ctl=`<input class="specOther" type="number" min="0" max="100" step="1" inputmode="numeric" placeholder="0–100" data-textkey="${key}" value="${esc(v)}" ${req} ${locked?'disabled':''}>`;else if(t==='currency')ctl=`<input class="specOther" type="number" min="0" step="0.01" inputmode="decimal" placeholder="$" data-textkey="${key}" value="${esc(v)}" ${req} ${locked?'disabled':''}>`;else if(t==='date')ctl=`<input class="specOther" type="date" data-textkey="${key}" value="${esc(v)}" ${req} ${locked?'disabled':''}>`;else if(t==='longtext')ctl=`<textarea class="specOther" rows="3" data-textkey="${key}" ${req} ${locked?'disabled':''}>${esc(v)}</textarea>`;else if(t==='dropdown')ctl=`<select class="specOther" data-textkey="${key}" ${req} ${locked?'disabled':''}><option value="">Select…</option>${(r.options||[]).map(o=>`<option ${v===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`;else if(t==='radio'||t==='yesno'){let choices=t==='yesno'?['Yes','No']:(r.options||[]);ctl=`<div class="checks">${choices.map(o=>`<label><input type="radio" name="${key}" data-radiokey="${key}" value="${esc(o)}" ${v===o?'checked':''} ${req} ${locked?'disabled':''}> ${esc(o)}</label>`).join('')}</div>`}else if(t==='checkboxes'){let vals=saved['r'+ri]||[];ctl=`<div class="checks">${(r.options||[]).map(o=>`<label><input type="checkbox" data-key="r${ri}" value="${esc(o)}" ${vals.includes(o)?'checked':''} ${locked?'disabled':''}> ${esc(o)}</label>`).join('')}</div>`}return `<div class="optionrow"><div class="optionrowInner"><div class="optionrowContent"><div class="optlabel">${esc(r.label||'Field')}${mark}</div>${ctl}</div>${isWarrantyPhotoExcluded(r.label)?'':groupPhotoControl(ri,r.label||'Field',locked)}</div></div>`}const defs=inputDefinitions(r),opts=checkboxOptions(r);let inputs=defs.length?`<div class="specInputs">${defs.map((d,di)=>`<label class="specInput"><b>${esc(d.label)}</b><input type="${d.type}" ${d.min!=null?`min="${d.min}"`:''} ${d.max!=null?`max="${d.max}"`:''} data-textkey="r${ri}_in_${d.key||di}" value="${esc(saved['r'+ri+'_in_'+(d.key||di)]||'')}" ${locked?'disabled':''}></label>`).join('')}</div>`:'';let checks=opts.length?`<div class="checks">${opts.map(o=>`<label><input type="checkbox" data-key="r${ri}" value="${esc(o)}" ${(saved['r'+ri]||[]).includes(o)?'checked':''} ${locked?'disabled':''}> ${esc(o)}</label>`).join('')}</div>`:'';let other=(!defs.length&&!opts.length)?`<input class="specOther" data-textkey="r${ri}" value="${esc(saved['r'+ri]||'')}" ${locked?'disabled':''}>`:'';return `<div class="optionrow"><div class="optionrowInner"><div class="optionrowContent"><div class="optlabel">${esc(r.label||'Options')}${mark}</div>${inputs}${checks}${other}</div>${isWarrantyPhotoExcluded(r.label)?'':groupPhotoControl(ri,r.label||'Options',locked)}</div></div>`}
function renderRows(rows,data,locked){return rows.map((r,ri)=>{const saved=data||{},t=r.fieldType||'auto',req=r.required?'required':'',mark=r.required?'<span class="req"> *</span>':'';if(t!=='auto'){let key=`r${ri}_field`,v=saved[key]||'',ctl='';if(t==='text')ctl=`<input class="specOther" data-textkey="${key}" value="${esc(v)}" ${req} ${locked?'disabled':''}>`;else if(t==='number')ctl=`<input class="specOther" type="number" data-textkey="${key}" value="${esc(v)}" ${req} ${locked?'disabled':''}>`;else if(t==='percentage')ctl=`<input class="specOther" type="number" min="0" max="100" step="1" inputmode="numeric" placeholder="0–100" data-textkey="${key}" value="${esc(v)}" ${req} ${locked?'disabled':''}>`;else if(t==='currency')ctl=`<input class="specOther" type="number" min="0" step="0.01" inputmode="decimal" placeholder="$" data-textkey="${key}" value="${esc(v)}" ${req} ${locked?'disabled':''}>`;else if(t==='date')ctl=`<input class="specOther" type="date" data-textkey="${key}" value="${esc(v)}" ${req} ${locked?'disabled':''}>`;else if(t==='longtext')ctl=`<textarea class="specOther" rows="3" data-textkey="${key}" ${req} ${locked?'disabled':''}>${esc(v)}</textarea>`;else if(t==='dropdown')ctl=`<select class="specOther" data-textkey="${key}" ${req} ${locked?'disabled':''}><option value="">Select…</option>${(r.options||[]).map(o=>`<option ${v===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`;else if(t==='radio'||t==='yesno'){let choices=t==='yesno'?['Yes','No']:(r.options||[]);ctl=`<div class="checks">${choices.map(o=>`<label><input type="radio" name="${key}" data-radiokey="${key}" value="${esc(o)}" ${v===o?'checked':''} ${req} ${locked?'disabled':''}> ${esc(o)}</label>`).join('')}</div>`}else if(t==='checkboxes'){let vals=saved['r'+ri]||[];ctl=`<div class="checks">${(r.options||[]).map(o=>`<label><input type="checkbox" data-key="r${ri}" value="${esc(o)}" ${vals.includes(o)?'checked':''} ${locked?'disabled':''}> ${esc(o)}</label>`).join('')}</div>`}return `<div c function collect(){let data={notes:$('#notes')?.value||'',date:$('#date')?.value||'',desc:$('#desc')?.value||'',salesinitials:current?.initials||currentUser.initials||'',asking:$('#asking')?.value||'',year:$('#year')?.value||'',purchased:radioVal('purchased'),unitloc:radioVal('unitloc'),trade:$('#trade')?.value||'',owner:$('#owner')?.value||'',phone:$('#phone')?.value||'',contact:radioVal('contact'),general:$('#general')?.value||'',paint:$('#paint')?.value||'',mechanical:$('#mechanical')?.value||'',hours:$('#hours')?.value||'',hoursdate:$('#hoursdate')?.value||'',recon:$('#recon')?.value||'',reconplan:$('#reconplan')?.value||''};document.querySelectorAll('[data-key]').forEach(x=>{if(x.checked)(data[x.dataset.key]??=[]).push(x.value)});document.querySelectorAll('[data-textkey]').forEach(x=>data[x.dataset.textkey]=x.value);document.querySelectorAll('[data-radiokey]:checked').forEach(x=>data[x.dataset.radiokey]=x.value);return {serial:$('#serial')?.value.trim()||'',make:$('#make')?.value.trim()||'',model:$('#model')?.value.trim()||'',stock:$('#stock')?.value.trim()||'',customer:$('#owner')?.value.trim()||'',data}}
function persist(status,action){let d=db(),r=d.records.find(x=>x.id===current.id),v=collect();Object.assign(r,v,{status,updated:new Date().toISOString()});r.audit??=[];r.audit.push({at:r.updated,by:currentUser.email,action});put(d);current=r;return r}
function saveCurrent(){persist('Draft','DRAFT_SAVED');openRecord(current.id)}
function submitCurrent(){let v=collect();if(!v.serial){alert('Full Serial Number is required before submitting.');$('#serial').focus();return}let missing=[];(FORMS[current.form]?.rows||[]).forEach((r,ri)=>{if(!r.required)return;let t=r.fieldType||'auto';if(t==='checkboxes'){if(!(v.data['r'+ri]||[]).length)missing.push(r.label)}else if(t==='radio'||t==='yesno'||t==='text'||t==='number'||t==='percentage'||t==='currency'||t==='date'||t==='dropdown'||t==='longtext'){if(!String(v.data['r'+ri+'_field']||'').trim())missing.push(r.label)}});if(missing.length){alert('Please complete required field'+(missing.length>1?'s':'')+':\n\n'+missing.join('\n'));return}let d=db(),dupes=d.records.filter(x=>x.id!==current.id&&x.serial&&x.serial.toLowerCase()===v.serial.toLowerCase());if(dupes.length&&!confirm(`Serial ${v.serial} also appears on ${dupes.map(x=>x.id).join(', ')}. Continue anyway?`))return;let r=d.records.find(x=>x.id===current.id);Object.assign(r,v,{status:'Submitted',updated:new Date().toISOString(),revisions:(r.revisions||0)+1});r.audit??=[];r.audit.push({at:r.updated,by:currentUser.email,action:'REVISION_'+r.revisions+'_SUBMITTED'});put(d);current=r;openRecord(r.id)}
function confirmFinalize(){if(!$('#customer').value.trim()){alert('Customer Name is required before Finalizing.');return}showModal(`<h2>Finalize ${current.id}?</h2><p>Once finalized, you will no longer be able to edit this appraisal. A System Administrator must reopen it if corrections are required.</p><div class="actions"><button class="btn light" onclick="hideModal()">Cancel</button><button class="btn red" onclick="doFinalize()">Finalize Appraisal</button></div>`)}
function doFinalize(){let d=db(),r=d.records.find(x=>x.id===current.id);r.status='Finalized';r.updated=new Date().toISOString();r.audit.push({at:r.updated,by:currentUser.email,action:'FINALIZED'});put(d);hideModal();openRecord(r.id)}
function refreshAttachmentUI(){
 if(document.getElementById('photoCount')) photoCount.textContent=`${photos.length} / 20 selected`;
 if(document.getElementById('photoGrid')) photoGrid.innerHTML=photos.length?photos.map((p,i)=>`<div class="photo">${p.url?`<img src="${p.url}">`:'<div style="padding:30px">File</div>'}<div class="tiny" style="padding:7px 8px 0;font-weight:800">${esc(p.groupLabel||'General Equipment Photo')}</div><input placeholder="Optional caption" value="${esc(p.caption||'')}" oninput="photos[${i}].caption=this.value;photoSessions[current.id]=photos"></div>`).join(''):'<span class="muted">No photos selected in this session.</span>';
 if(document.getElementById('internalPhotoBtnText')) internalPhotoBtnText.textContent=internalPhotos.length?`${internalPhotos.length} Internal Photo${internalPhotos.length===1?'':'s'} · Add More`:'Add Internal Photo';
 if(document.getElementById('internalPhotoThumbs')) internalPhotoThumbs.innerHTML=internalPhotos.map((p,i)=>p.url?`<div class="internalThumbWrap"><img src="${p.url}" title="Internal photo"><button type="button" class="internalRemove" onclick="removeInternalPhoto(${i})" title="Remove photo">×</button></div>`:'').join('');
 if(document.getElementById('paperCount')) paperCount.textContent=`${paperPhotos.length} supporting file${paperPhotos.length===1?'':'s'} selected`;
}
function loadPhotos(files,type){let arr=type==='equipment'?photos:paperPhotos,max=type==='equipment'?20:50;for(let f of [...files]){if(arr.length>=max)break;arr.push({file:f,url:f.type.startsWith('image/')?URL.createObjectURL(f):'',caption:''})}if(current){if(type==='equipment')photoSessions[current.id]=arr;else paperPhotoSessions[current.id]=arr}refreshAttachmentUI()}

function inputDefinitions(r){
  const label=(r.label||"").toLowerCase();
  const opts=r.options||[];
  const defs=[];

  // Generic front/rear tire or track SIZE rows were blank-entry fields on the paper forms.
  if(/^(front|rear) tire\/track size$/.test(label)){
    const side=label.startsWith("front")?"Front":"Rear";
    defs.push({label:side+" Tire/Track Size",type:"text",key:"size"});
    if(opts.some(o=>/duals/i.test(o))) defs.push({label:side+" Duals %",type:"number",key:"duals",min:0,max:100});
    if(opts.some(o=>/triples/i.test(o))) defs.push({label:side+" Triples %",type:"number",key:"triples",min:0,max:100});
    return defs;
  }

  // Tread / wear percentage rows should be entered as percentages, not checked.
  if(/tread\s*%|track\s*%/.test(label) || opts.some(o=>/tread\s*%/i.test(o))){
    // Avoid converting rows that are clearly lists of real tire/track sizes.
    const realSizeChoices=opts.filter(o=>/\d+[\/x.-]\d+|R\d+|tracks?$/i.test(o)).length;
    if(realSizeChoices < 2){
      const pctOpts=opts.filter(o=>/%|tread/i.test(o));
      if(pctOpts.length){
        pctOpts.forEach((o,k)=>{
          let clean=o.replace(/^%+\s*/,"").replace(/\s*%+$/,"").replace(/tread/ig,"").trim();
          if(!clean) clean=(label.includes("front")?"Front":label.includes("rear")?"Rear":"Wear");
          defs.push({label:clean+" %",type:"number",key:"pct"+k,min:0,max:100});
        });
      }else{
        defs.push({label:r.label,type:"number",key:"pct",min:0,max:100});
      }
      return defs;
    }
  }

  // Rows like Tire BrandOther contain Front Tread % / Rear Tread % entry fields.
  if(opts.length && opts.every(o=>/tread\s*%/i.test(o))){
    opts.forEach((o,k)=>defs.push({
      label:o.replace(/\s*%/,"").trim()+" %",
      type:"number",key:"pct"+k,min:0,max:100
    }));
    return defs;
  }

  // Transmission: keep transmission types selectable, but gears are entered numerically.
  if(label==="transmission" && opts.some(o=>/forward gears|reverse gears/i.test(o))){
    opts.forEach((o,k)=>{
      if(/forward gears/i.test(o)) defs.push({label:"Forward Gears",type:"number",key:"fwd",min:0});
      else if(/reverse gears/i.test(o)) defs.push({label:"Reverse Gears",type:"number",key:"rev",min:0});
      else if(/^ranges?$/i.test(o.trim())) defs.push({label:"Ranges",type:"number",key:"ranges",min:0});
    });
    return defs;
  }

  // Tire Appraisal: number of tires and tread % are both numeric entries.
  if(label==="number of tires"){
    defs.push({label:"Number of Tires",type:"number",key:"count",min:0});
    defs.push({label:"Tread %",type:"number",key:"tread",min:0,max:100});
    return defs;
  }

  // A standalone Track % row is a numeric wear field.
  if(label==="track %"){
    defs.push({label:"Track %",type:"number",key:"trackpct",min:0,max:100});
    return defs;
  }

  return defs;
}

function checkboxOptions(r){
  const label=(r.label||"").toLowerCase();
  let opts=[...(r.options||[])];

  // PTO rows: always provide a None choice when PTO selections are applicable.
  // Do not duplicate it if the source row already contains None / No PTO.
  if(/\bpto\b/.test(label) && opts.length && !opts.some(o=>/^(none|no pto)$/i.test(String(o).trim()))){
    opts.push("None");
  }
  if(/^(front|rear) tire\/track size$/.test(label)) return [];
  if(label==="number of tires" || label==="track %") return [];
  if(label==="transmission" && opts.some(o=>/forward gears|reverse gears/i.test(o))){
    return opts.filter(o=>!/forward gears|reverse gears/i.test(o) && !/^ranges?$/i.test(o.trim()));
  }
  if(opts.length && opts.every(o=>/tread\s*%/i.test(o))) return [];
  if(/tread\s*%/.test(label) && !opts.some(o=>/\d+[\/x.-]\d+|R\d+|tracks?$/i.test(o))) return [];
  return opts;
}

async function addPhotoPages(doc,r){if(!photos.length)return;for(let i=0;i<photos.length;i++){if(i%4===0){doc.addPage('letter','portrait');try{doc.addImage(APPRAISAL_LOGO,'JPEG',24,12,105,25)}catch(e){}doc.setDrawColor(200,16,46);doc.setLineWidth(2.2);doc.line(24,42,588,42);doc.setFont('helvetica','bold');doc.setFontSize(10);doc.text('Equipment Photos',588,24,{align:'right'});doc.setFontSize(8);doc.text(r.id,588,35,{align:'right'})}let slot=i%4,row=Math.floor(slot/2),col=slot%2,x=24+col*282,y=55+row*350,w=270,h=285;try{let data=await fileToDataURL(photos[i].file);doc.addImage(data,'JPEG',x,y,w,h,undefined,'FAST')}catch(e){}doc.setFont('helvetica','normal');doc.setFontSize(8);doc.text(photos[i].caption||photos[i].groupLabel||('Photo '+(i+1)),x,y+h+13)} }
async function deliverPdf(doc,name){const blob=doc.output('blob');const isiOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);if(isiOS&&navigator.share){const file=new File([blob],name,{type:'application/pdf'});if(!navigator.canShare||navigator.canShare({files:[file]})){try{await navigator.share({title:name,files:[file]});return}catch(e){if(e&&e.name==='AbortError')return}}}const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.style.display='none';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000)}

let expandedBuilderRow=-1;
function builderTypeLabel(v){let m={auto:'Auto / Legacy',text:'Free Text',number:'Number Only',percentage:'Percentage (0–100)',currency:'Currency',date:'Date',dropdown:'Dropdown',radio:'Single Select',checkboxes:'Checkboxes / Multi-select',yesno:'Yes / No',longtext:'Long Text / Notes'};return m[v]||'Free Text'}
function toggleBuilderRow(i){expandedBuilderRow=expandedBuilderRow===i?-1:i;renderBuilder();setTimeout(()=>{let el=document.getElementById('builderRow'+i);if(el&&expandedBuilderRow===i)el.scrollIntoView({block:'nearest'})},0)}
function typeNeedsChoices(t){return ['dropdown','radio','checkboxes'].includes(t)}
function builderRowHtml(r,ri){let t=inferredBuilderType(r);if(!r.fieldKey)r.fieldKey=slugKey(r.label);if(r.required==null)r.required=false;r.fieldType=t;r.options=r.options||[];let choices=typeNeedsChoices(t)?`<div class="builderOpts"><div class="tiny muted" style="font-weight:800;margin-bottom:5px">${t==='dropdown'?'Dropdown Options':'Choices / Options'}</div>${r.options.map((o,oi)=>`<div class="builderOptsRow"><span class="dragHandle">⋮⋮</span><input value="${esc(o)}" oninput="builderDraft.rows[${ri}].options[${oi}]=this.value"><button class="iconBtn danger" title="Remove option" onclick="removeBuilderOption(${ri},${oi})">×</button></div>`).join('')}<button class="btn light" style="padding:8px 11px;margin-top:5px" onclick="addBuilderOption(${ri})">＋ Add Option</button></div>`:'';let open=expandedBuilderRow===ri;return `<div class="builderRow ${open?'expanded':''}" id="builderRow${ri}"><div class="builderRowHead"><span class="dragHandle">⋮⋮</span><div class="builderRowSummary"><div class="builderSummaryName">${esc(r.label||'Untitled Field')}</div><div class="builderSummaryType">${esc(builderTypeLabel(t))}</div><div class="builderSummaryReq">${r.required?'☑ Required':'Not required'}</div><button class="btn light builderEditBtn" onclick="toggleBuilderRow(${ri})">${open?'Close':'Edit'}</button></div></div><div class="builderExpanded"><div class="builderLabelEdit"><label>Field Label</label><input value="${esc(r.label)}" oninput="builderDraft.rows[${ri}].label=this.value"></div><div class="fieldConfig"><div class="field"><label>Field Type</label><select onchange="builderDraft.rows[${ri}].fieldType=this.value;expandedBuilderRow=${ri};renderBuilder()">${builderTypeOptions(t)}</select><div class="builderHelp">Controls how salespeople enter and validate this field.</div></div><div class="field"><label>Field Key</label><input class="builderKey" value="${esc(r.fieldKey)}" oninput="builderDraft.rows[${ri}].fieldKey=slugKey(this.value);this.value=builderDraft.rows[${ri}].fieldKey"><div class="builderHelp">Links the same field across forms.</div></div><div class="field"><label>Required?</label><label class="reqCompact"><input type="checkbox" ${r.required?'checked':''} onchange="builderDraft.rows[${ri}].required=this.checked"><span>Required</span></label><div class="builderHelp">Must be completed before submission.</div></div></div>${choices}<div class="builderAdvancedActions"><button class="btn out" onclick="openApplyToForms(${ri})">⇄ Apply to Other Forms</button><button class="btn light" onclick="moveBuilderRow(${ri},-1)">↑ Move Up</button><button class="btn light" onclick="moveBuilderRow(${ri},1)">↓ Move Down</button><button class="btn light" style="color:#b31f24" onclick="removeBuilderRow(${ri})">× Remove Field</button></div></div></div>`}
function normalizedBuilderSectionName(r){return String(r.builderSection||'Equipment-Specific Options').trim()||'Equipment-Specific Options'}
function builderSectionNames(){let names=[];(builderDraft.rows||[]).forEach(r=>{let n=normalizedBuilderSectionName(r);if(!names.includes(n))names.push(n)});(builderDraft.builderSections||[]).forEach(n=>{n=String(n||'').trim();if(n&&!names.includes(n))names.push(n)});if(!names.length)names.push('Equipment-Specific Options');return names}
function builderSectionsHtml(){return builderSectionNames().map((name,si)=>{let indexes=[];(builderDraft.rows||[]).forEach((r,i)=>{if(normalizedBuilderSectionName(r)===name)indexes.push(i)});return `<div class="builderSection"><div class="builderSectionHead"><input value="${esc(name)}" aria-label="Section name" onchange="renameBuilderSection(${si},this.value)"><span class="sectionFieldCount">${indexes.length} field${indexes.length===1?'':'s'}</span><div class="builderSectionActions"><button class="btn out" onclick="addBuilderRow(${si})">＋ Add Field</button><button class="btn light" onclick="moveBuilderSection(${si},-1)">↑ Section</button><button class="btn light" onclick="moveBuilderSection(${si},1)">↓ Section</button>${builderSectionNames().length>1?`<button class="btn light" style="color:#b31f24" onclick="removeBuilderSection(${si})">× Remove Section</button>`:''}</div></div><div class="builderSectionFields">${indexes.length?indexes.map(i=>builderRowHtml(builderDraft.rows[i],i)).join(''):'<div class="builderEmptySection">No fields yet. Click <b>＋ Add Field</b> to add the first field to this section.</div>'}</div></div>`}).join('')}
function addBuilderSection(){builderDraft.builderSections=builderSectionNames();let base='New Section',name=base,n=2;while(builderDraft.builderSections.includes(name))name=base+' '+n++;builderDraft.builderSections.push(name);expandedBuilderRow=-1;renderBuilder();setTimeout(()=>{let els=document.querySelectorAll('.builderSection');els[els.length-1]?.scrollIntoView({behavior:'smooth',block:'center'})},0)}
function addBuilderRow(sectionIndex=0){let sections=builderSectionNames(),section=sections[Math.max(0,Math.min(sectionIndex,sections.length-1))]||'Equipment-Specific Options';builderDraft.rows=builderDraft.rows||[];builderDraft.rows.push({label:'New Field',fieldKey:'new_field_'+(builderDraft.rows.length+1),fieldType:'text',required:false,options:[],builderSection:section});expandedBuilderRow=builderDraft.rows.length-1;renderBuilder();setTimeout(()=>document.getElementById('builderRow'+expandedBuilderRow)?.scrollIntoView({behavior:'smooth',block:'center'}),0)}
function removeBuilderRow(i){if(!confirm('Remove this field from the draft form?'))return;builderDraft.rows.splice(i,1);expandedBuilderRow=-1;renderBuilder()}
function moveBuilderRow(i,dir){let target=i+dir;if(target<0||target>=builderDraft.rows.length)return;let section=normalizedBuilderSectionName(builderDraft.rows[i]);let candidates=[];builderDraft.rows.forEach((r,idx)=>{if(normalizedBuilderSectionName(r)===section)candidates.push(idx)});let pos=candidates.indexOf(i),otherPos=pos+dir;if(otherPos<0||otherPos>=candidates.length)return;let j=candidates[otherPos],tmp=builderDraft.rows[i];builderDraft.rows[i]=builderDraft.rows[j];builderDraft.rows[j]=tmp;expandedBuilderRow=j;renderBuilder()}
function renameBuilderSection(si,value){let names=builderSectionNames(),old=names[si],next=String(value||'').trim();if(!next){alert('Section name cannot be blank.');renderBuilder();return}if(names.some((n,i)=>i!==si&&n.toLowerCase()===next.toLowerCase())){alert('That section name already exists.');renderBuilder();return}(builderDraft.rows||[]).forEach(r=>{if(normalizedBuilderSectionName(r)===old)r.builderSection=next});builderDraft.builderSections=names.map((n,i)=>i===si?next:n);renderBuilder()}
function moveBuilderSection(si,dir){let names=builderSectionNames(),j=si+dir;if(j<0||j>=names.length)return;[names[si],names[j]]=[names[j],names[si]];builderDraft.builderSections=names;renderBuilder()}
function removeBuilderSection(si){let names=builderSectionNames(),name=names[si],count=(builderDraft.rows||[]).filter(r=>normalizedBuilderSectionName(r)===name).length;if(count&& !confirm(`Remove section "${name}" and its ${count} field${count===1?'':'s'} from the draft?`))return;if(!count&&!confirm(`Remove empty section "${name}"?`))return;builderDraft.rows=(builderDraft.rows||[]).filter(r=>normalizedBuilderSectionName(r)!==name);builderDraft.builderSections=names.filter((_,i)=>i!==si);expandedBuilderRow=-1;renderBuilder()}
function addBuilderOption(i){builderDraft.rows[i].options.push('New Option');renderBuilder()}
function removeBuilderOption(i,j){builderDraft.rows[i].options.splice(j,1);renderBuilder()}
function openApplyToForms(ri){let src=builderDraft.rows[ri];if(!src.fieldKey)src.fieldKey=slugKey(src.label);let targets=FORMS.map((f,i)=>i===builderIndex?'':`<label><input type="checkbox" class="syncTarget" value="${i}"> ${esc(f.title)}</label>`).join('');showModal(`<h2>Apply Field to Other Forms</h2><div class="muted"><b>${esc(src.label)}</b> · key: <span class="builderKey">${esc(src.fieldKey)}</span></div><div class="syncFlag">Choose the forms and exactly which settings should be synchronized. Nothing is published until you confirm this step.</div><h3>Apply these settings</h3><div class="syncAttrs"><label><input type="checkbox" class="syncAttr" value="label" checked> Field Name</label><label><input type="checkbox" class="syncAttr" value="fieldType" checked> Field Type</label><label><input type="checkbox" class="syncAttr" value="required" checked> Required</label><label><input type="checkbox" class="syncAttr" value="options" checked> Choices / Options</label></div><h3>Target appraisal forms</h3><div class="actions"><button class="btn light" onclick="document.querySelectorAll('.syncTarget').forEach(x=>x.checked=true)">Select All</button><button class="btn light" onclick="document.querySelectorAll('.syncTarget').forEach(x=>x.checked=false)">Clear</button></div><div class="targetGrid">${targets}</div><div class="actions"><button class="btn red" onclick="applyFieldToForms(${ri})">Apply Changes</button><button class="btn light" onclick="hideModal()">Cancel</button></div>`)}
function applyFieldToForms(ri){let src=builderDraft.rows[ri],targets=[...document.querySelectorAll('.syncTarget:checked')].map(x=>+x.value),attrs=[...document.querySelectorAll('.syncAttr:checked')].map(x=>x.value);if(!targets.length){alert('Select at least one appraisal form.');return}if(!attrs.length){alert('Select at least one setting to apply.');return}let st=builderStore(),changed=0;targets.forEach(i=>{let base=JSON.parse(JSON.stringify(st[FORMS[i].title]?.draft||FORMS[i]));base.rows=base.rows||[];let row=base.rows.find(x=>(x.fieldKey&&x.fieldKey===src.fieldKey)||(!x.fieldKey&&slugKey(x.label)===src.fieldKey));if(!row){row={label:src.label,fieldKey:src.fieldKey,fieldType:src.fieldType,required:!!src.required,options:[]};base.rows.push(row)}row.fieldKey=src.fieldKey;attrs.forEach(a=>row[a]=JSON.parse(JSON.stringify(src[a]??(a==='options'?[]:''))));let key=FORMS[i].title;st[key]=st[key]||{};st[key].draft=base;changed++});saveBuilderStore(st);hideModal();alert(`Applied ${src.label} to ${changed} form${changed===1?'':'s'} as Draft Changes. Review and publish each affected form when ready.`)}
function saveBuilderDraft(silent=false){builderMeta();let st=builderStore(),key=FORMS[builderIndex].title;st[key]=st[key]||{};st[key].draft=JSON.parse(JSON.stringify(builderDraft));saveBuilderStore(st);if(!silent)alert('Draft form changes saved. Salespeople will not see them until you Publish Changes.')}
function publishBuilder(){builderMeta();if(!builderDraft.title.trim()){alert('Appraisal Name is required.');return}if(!confirm('Publish these form changes? New appraisals will use this version. Existing appraisals keep their original form version.'))return;let oldKey=FORMS[builderIndex].title,st=builderStore();let entry=st[oldKey]||{};entry.history=entry.history||[];entry.history.push({publishedAt:new Date().toISOString(),form:JSON.parse(JSON.stringify(FORMS[builderIndex]))});entry.published=JSON.parse(JSON.stringify(builderDraft));entry.draft=null;if(builderDraft.title!==oldKey){delete st[oldKey];st[builderDraft.title]=entry}else st[oldKey]=entry;FORMS[builderIndex]=JSON.parse(JSON.stringify(builderDraft));saveBuilderStore(st);alert('Published. New appraisals now use the updated form.');formBuilder(builderIndex)}
function builderPreview(){builderMeta();let sections=builderSectionNames().map(name=>`<div class="section"><h2>${esc(name)}</h2>${builderDraft.rows.map((r,ri)=>normalizedBuilderSectionName(r)===name?renderBuilderPreviewField(r,ri):'').join('')}</div>`).join('');showModal(`<div class="builderPreviewTop"><div><div class="builderPreviewTitle">Website Form Preview</div><div class="builderPreviewMeta">${esc(builderDraft.title)} · ${esc(builderDraft.category)}</div></div><button class="btn dark" onclick="hideModal()">← Back to Form Builder</button></div>${sections}<div class="actions"><button class="btn dark" onclick="hideModal()">← Back to Form Builder</button></div>`) }
function renderBuilderPreviewField(r,ri){let t=inferredBuilderType(r),req=r.required?'<span class="req"> *</span>':'';let choices=(r.options||[]);let control='';if(t==='percentage')control='<input disabled placeholder="0–100" type="number" min="0" max="100">';else if(t==='number')control='<input disabled type="number">';else if(t==='currency')control='<input disabled type="number" step="0.01" placeholder="$">';else if(t==='date')control='<input disabled type="date">';else if(t==='longtext')control='<textarea disabled rows="3"></textarea>';else if(t==='dropdown')control=`<select disabled><option>Select…</option>${choices.map(o=>`<option>${esc(o)}</option>`).join('')}</select>`;else if(t==='radio'||t==='yesno')control=`<div class="checks">${(t==='yesno'?['Yes','No']:choices).map(o=>`<label><input type="radio" disabled> ${esc(o)}</label>`).join('')}</div>`;else if(t==='checkboxes'||t==='auto')control=`<div class="checks">${choices.map(o=>`<label><input type="checkbox" disabled> ${esc(o)}</label>`).join('')}</div>`;else control='<input disabled>';return `<div class="optionrow"><div class="optlabel">${esc(r.label)}${req}</div>${control}</div>`}
function newBuilderForm(){
  let options=FORMS.map((f,i)=>`<option value="${i}">${esc(f.title)} — ${esc(f.category)}</option>`).join('');
  showModal(`<h2>Add Appraisal Form</h2><p class="muted">Start from scratch or copy an existing appraisal as your starting point.</p>
  <div class="field"><label>Appraisal Name</label><input id="newFormName" placeholder="Example: New Tractor Appraisal"></div>
  <div class="field" style="margin-top:12px"><label>Category</label><input id="newFormCat" placeholder="Example: Tractor"></div><div class="field" style="margin-top:12px"><label>Default DMS Group Code</label><input id="newFormDms" placeholder="Optional — can be added later in Form Builder"></div>
  <div class="field" style="margin-top:14px"><label>Starting Point</label><div style="display:flex;gap:18px;flex-wrap:wrap;margin-top:8px"><label style="font-weight:600"><input type="radio" name="newFormMode" value="blank" checked onchange="toggleCopyTemplate()"> Start Blank</label><label style="font-weight:600"><input type="radio" name="newFormMode" value="copy" onchange="toggleCopyTemplate()"> Copy Existing Form</label></div></div>
  <div class="field" id="copyTemplateWrap" style="margin-top:12px;display:none"><label>Copy Template From</label><select id="copyTemplateIndex">${options}</select><div class="tiny muted" style="margin-top:6px">Copies sections, fields, field types, required settings, choices and field keys. The new form remains independent.</div></div>
  <div class="notice" style="margin-top:14px">New appraisal forms begin as Draft/Unpublished until you publish them.</div>
  <div class="actions" style="margin-top:18px"><button class="btn light" onclick="hideModal()">Cancel</button><button class="btn red" onclick="createBuilderForm()">Create Appraisal Form</button></div>`)
}
function toggleCopyTemplate(){let mode=document.querySelector('input[name="newFormMode"]:checked')?.value||'blank';let w=$('#copyTemplateWrap');if(w)w.style.display=mode==='copy'?'block':'none';if(mode==='copy'){let i=Number($('#copyTemplateIndex')?.value||0),src=FORMS[i];if(src){let n=$('#newFormName'),c=$('#newFormCat');if(n&&!n.value)n.value='Copy of '+src.title;if(c&&!c.value)c.value=src.category}}}
function createBuilderForm(){
  let name=($('#newFormName')?.value||'').trim(); if(!name){alert('Enter an appraisal name.');return}
  let cat=($('#newFormCat')?.value||'Other').trim()||'Other'; let dms=($('#newFormDms')?.value||'').trim();
  let mode=document.querySelector('input[name="newFormMode"]:checked')?.value||'blank', nf;
  if(mode==='copy'){
    let i=Number($('#copyTemplateIndex')?.value||0),src=FORMS[i];
    nf=JSON.parse(JSON.stringify(src)); nf.title=name; nf.category=cat; nf.defaultDmsGroupCode=dms||nf.defaultDmsGroupCode||''; nf.file='Form Builder Copy';
    nf.formId='FORM-'+Date.now(); nf.copiedFrom=src.title; nf.published=false;
  }else{
    nf={title:name,file:'Form Builder',category:cat,defaultDmsGroupCode:dms,rows:[],builderSections:[],formId:'FORM-'+Date.now(),published:false};
  }
  FORMS.push(nf); builderIndex=FORMS.length-1; builderDraft=JSON.parse(JSON.stringify(nf)); hideModal(); renderBuilder();
}

function showModal(x){dialog.innerHTML=x;modal.classList.remove('hidden')}function hideModal(){modal.classList.add('hidden')}
loadBuilderOverrides();userBar();home();
</script><div class="footer"><strong>Arnold's Appraisal System V2 · Prototype Version 0.27</strong></div></body></html>
